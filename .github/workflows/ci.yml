name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A run you can start by hand, from the Actions tab or the API. Without
  # one there is no way to tell a queue that is merely slow from a run
  # that will never start, which is exactly the question worth answering
  # when nothing appears to be happening.
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, accounting, database, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: altier
          POSTGRES_PASSWORD: altier
          POSTGRES_DB: altier
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U altier"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Vite 5 requires ^18 || >=20; 20 is the current LTS.
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Revenue-recognition rules fail silently: a charge recognised twice, or
      # a deposit leaking into revenue, looks like ordinary growth on a chart.
      # This asserts the invariants that no reviewer would catch by eye.
      - name: Accounting invariants
        run: npm run check:accounting

      # An identity token is the whole boundary for Google and Apple sign-in:
      # everything downstream believes what it says. This mints forged ones —
      # unsigned, wrongly signed, addressed elsewhere, replayed — against the
      # real verifier and insists each is refused.
      - name: Sign-in token verification
        run: npm run check:sso

      # The real target. Migrates, seeds and reads the portfolio back out,
      # checking the figures survive the round trip and that the schema's
      # constraints reject what they claim to reject.
      - name: Database round trip (Postgres)
        run: npm run db:check
        env:
          DATABASE_URL: postgres://altier:altier@localhost:5432/altier

      # The same check on the driver contributors use locally, so the
      # no-server path cannot rot unnoticed.
      - name: Database round trip (PGlite)
        run: npm run db:check

      # docs/setup.sql is generated from the migrations and pasted into a
      # hosted database's SQL editor. If it drifts from the schema it stops
      # producing a working database, silently, for anyone following the
      # deployment guide. server/db/expected-migrations.ts is generated from
      # the same journal and compiled into the API, so it drifts the same way.
      - name: Setup SQL is current
        run: npm run db:sql -- --check

      # A database can hold a schema and still be the wrong one: the
      # properties table has existed since the first migration, so one that
      # is missing a later one passes a naive health check and fails much
      # later on a column that is not there. This builds exactly that
      # database and insists health names what is outstanding.
      - name: Health reports a database that is behind
        run: npm run check:stale
        env:
          DATABASE_URL: postgres://altier:altier@localhost:5432/altier
          VERCEL: '1'

      # The path a real deployment takes: an empty database that still has to
      # serve a portfolio. It has its own failure mode — the reminder settings
      # singleton and the team are not optional, and nothing else notices.
      - name: Empty portfolio bootstrap
        run: PGLITE_PATH=memory:// npm run db:init | tee /dev/stderr | grep -q 'empty portfolio ready'

      # The round trip never starts a server. This boots the real API against
      # the seeded database and exercises a read, a write and two error paths,
      # so a broken route or a mis-mapped status code fails here rather than
      # in the browser.
      - name: API smoke test
        run: npm run smoke:api
        env:
          DATABASE_URL: postgres://altier:altier@localhost:5432/altier

      - name: Build
        run: npm run build
